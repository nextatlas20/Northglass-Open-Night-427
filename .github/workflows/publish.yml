name: publish-ngo-427
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "nextatlas20"
          git config user.email "atlas@toiotech.com"
          ORIG=9e19e6318817bd3a6060a76d5af98124d394f3a0
          git checkout $ORIG -- _config.yml
          python3 - <<'PY'
          import re
          p = "_config.yml"
          with open(p, "r", encoding="utf-8", newline="") as f:
              data = f.read()
          repl = {
              "title": "Northglass Observatory Open Night",
              "description": "Public observing schedule for Northglass visitors",
              "email": "sky@northglass.example",
          }
          lines = data.split("\n")
          seen = set()
          out = []
          for line in lines:
              m = re.match(r"[ \t]*(title|description|email)[ \t]*:", line)
              if m and m.group(1) not in seen:
                  seen.add(m.group(1))
                  out.append(m.group(1) + ": " + repl[m.group(1)])
              else:
                  out.append(line)
          with open(p, "w", encoding="utf-8", newline="") as f:
              f.write("\n".join(out))
          print("replaced:", sorted(seen))
          PY
          git add _config.yml
          git commit -m "Set NGO-427 site configuration"
          git push
          echo "===== STAT ====="
          git diff --stat $ORIG HEAD -- _config.yml
          echo "===== BYTES ====="
          wc -c _config.yml
          echo "===== DIFF ====="
          git diff $ORIG HEAD -- _config.yml | cat -A | sed -n '1,80p'
